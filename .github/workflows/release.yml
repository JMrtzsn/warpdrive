name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf
        run: brew install protobuf

      - name: Install cargo-bundle and cargo-about
        run: cargo install cargo-bundle cargo-about

      - name: Build .app bundle
        run: ./script/macos/bundle --channel oss --nosign --nouniversal --arch ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}

      - name: Package .app as zip
        run: |
          APP_PATH=$(find target -name "WarpOss.app" -type d | head -1)
          cd "$(dirname "$APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/Warpdrive-macos-${{ matrix.arch }}.zip" "WarpOss.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpdrive-macos-${{ matrix.arch }}
          path: Warpdrive-macos-${{ matrix.arch }}.zip

  release:
    name: Create GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/warpdrive-macos-arm64/Warpdrive-macos-arm64.zip
            artifacts/warpdrive-macos-x86_64/Warpdrive-macos-x86_64.zip
