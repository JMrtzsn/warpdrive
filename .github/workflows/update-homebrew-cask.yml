name: Update Homebrew Cask

on:
  release:
    types: [published]

jobs:
  update-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./script/update-homebrew-cask "${{ github.event.release.tag_name }}"
