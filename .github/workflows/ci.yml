name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-arm64-ci-

      - name: Install protobuf
        run: brew install protobuf

      - name: Build
        run: cargo build --bin warpdrive

      - name: Test opencode_client
        run: cargo test -p opencode_client

      - name: Test opencode_adapter
        run: cargo test -p warp opencode_adapter

      - name: Check formatting
        run: cargo fmt -- --check
