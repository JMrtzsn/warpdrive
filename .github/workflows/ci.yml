on:
  pull_request:
    branches:
      - 'master'
      - 'main'
  push:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

name: CI

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --exclude command-signatures-v2 --all-targets --tests -- -D warnings

  test:
    name: Tests (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Compile tests
        run: cargo nextest run --workspace --locked --exclude command-signatures-v2 --no-run
      - name: Run unit tests
        run: cargo nextest run --workspace --locked --exclude command-signatures-v2 -E "not package(integration)"

  build-check:
    name: Build check (${{ matrix.name }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --exclude command-signatures-v2

  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [fmt, clippy, test, build-check]
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries | all(.value.result == "success")
          ' || (echo "::error::One or more CI jobs failed" && exit 1)
          echo "All jobs passed."
