name: Upstream Sync

# Periodically merges warpdotdev/warp (upstream) into master.
#
#   - Clean merge   -> pushes an `auto-sync/*` branch. The Sync Guard workflow
#                      (triggered by that push) builds warpdrive, asserts the
#                      kill switch survived, then opens and merges the PR.
#   - Merge conflict-> pushes the branch AND opens a PR labeled `sync:conflict`,
#                      then stops. A human (or the Copilot coding agent) resolves
#                      it.
#
# Runs weekly (Mondays 06:00 UTC) and on manual dispatch.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Merge upstream into a sync branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "warpdrive-sync[bot]"
          git config user.email "warpdrive-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/warpdotdev/warp.git
          git fetch upstream master

      - name: Attempt merge onto a sync branch
        id: merge
        run: |
          DATE="$(date +%Y-%m-%d)"
          BRANCH="auto-sync/upstream-${DATE}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          UPSTREAM_SHA="$(git rev-parse upstream/master)"
          BEHIND="$(git rev-list --count HEAD..upstream/master)"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"

          if [ "${BEHIND}" -eq 0 ]; then
            echo "Already up to date with upstream. Nothing to do."
            echo "result=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b "${BRANCH}"

          if git merge --no-edit upstream/master; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit --no-edit -m "Merge upstream/master (CONFLICTS - needs resolution)"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

          git push origin "${BRANCH}"

      - name: Open conflict PR (clean PRs are handled by the guard)
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Sync upstream/master (CONFLICTS - ${{ steps.merge.outputs.behind }} commits)" \
            --body "Automated upstream sync hit merge conflicts. This PR contains conflict markers and will NOT auto-merge. Resolve manually (or assign the Copilot coding agent).

          Upstream: \`${{ steps.merge.outputs.upstream_sha }}\`" \
            --label "sync:conflict"

      - name: Summary
        run: |
          echo "Result: ${{ steps.merge.outputs.result }}"
          echo "Branch: ${{ steps.merge.outputs.branch }}"
          echo "Commits behind upstream: ${{ steps.merge.outputs.behind }}"
